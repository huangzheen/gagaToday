<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1280,initial-scale=1.0"/>
<title>gagaToday — München Exploration Map</title>
<style>
/* ============================================================
   16-BIT RPG 城市探索地图 UI — 深蓝+金+羊皮纸
   ============================================================ */
:root {
  --navy: #07152b; --navy2: #0d2344; --navy3: #14305c;
  --gold: #e8b85c; --gold-light: #ffcf72;
  --paper: #f1dfbd; --paper2: #e8d4a8;
  --ink: #1c2540; --river: #82b7d9; --park: #a9c88b;
  --road: #c9b488; --road-center: #f6ead0;
  --red: #d85f45;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at 50% 10%,#17345c,#050b16);
  font-family:'Courier New','Noto Sans SC',monospace;
  color:#fff;
  min-height:100vh;
  display:flex;justify-content:center;align-items:center;
  image-rendering:pixelated;
}
.game-shell{
  width:1280px;height:800px;
  display:grid;
  grid-template-columns:200px 1fr 280px;
  grid-template-rows:64px 1fr 64px;
  gap:10px;padding:10px;
}
.pixel-panel{
  background:linear-gradient(180deg,var(--navy3),var(--navy));
  border:3px solid var(--gold);
  box-shadow:6px 6px 0 rgba(0,0,0,.7);
  position:relative;
}
.pixel-panel::after{
  content:'';position:absolute;inset:1px;
  border:1px solid rgba(232,184,92,.2);pointer-events:none;
}
/* 顶部栏 */
.top-bar{
  grid-column:1/-1;grid-row:1;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
}
.top-title{
  font-size:18px;font-weight:bold;color:var(--gold-light);
  letter-spacing:3px;text-shadow:2px 2px 0 #000;
}
.top-subtitle{font-size:10px;color:#6a8aaa;letter-spacing:2px}
.top-stats{display:flex;gap:20px;font-size:11px}
.stat-item{display:flex;align-items:center;gap:6px;color:var(--gold-light)}
.stat-item span{color:#8aaac8;font-size:10px}
/* 左侧面板 */
.side-panel{
  grid-column:1;grid-row:2;
  padding:14px 12px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;
}
.panel-section h3{
  font-size:10px;color:var(--gold);letter-spacing:2px;
  margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--navy2);
}
.panel-section p{font-size:9px;color:#8aaac8;line-height:1.6}
.quest-list{list-style:none;font-size:9px}
.quest-list li{
  padding:5px 0;color:#aab8cf;display:flex;align-items:center;gap:6px;
}
.quest-list li::before{content:'⬡';color:var(--gold);font-size:10px}
.quest-list li.done{color:#5a7a5a}
.quest-list li.done::before{content:'✦';color:#5a9a5a}
/* 地图框 */
.map-frame{
  grid-column:2;grid-row:2;
  position:relative;background:var(--paper);
  border:4px solid #c38a4f;
  box-shadow:10px 10px 0 rgba(0,0,0,.7);
  overflow:hidden;
}
.map-frame svg{display:block;width:100%;height:100%}
/* 右侧面板 */
.detail-panel{
  grid-column:3;grid-row:2;
  padding:14px 12px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;
}
.detail-header h2{font-size:16px;color:var(--gold-light);margin-bottom:2px}
.detail-header .de-name{font-size:10px;color:#6a8aaa;font-style:italic}
.detail-desc{font-size:10px;color:#aab8bf;line-height:1.6}
.detail-actions{display:flex;flex-wrap:wrap;gap:6px}
.action-chip{
  background:var(--navy2);border:2px solid #3a5a7a;
  color:var(--gold-light);font-size:9px;padding:4px 10px;
  cursor:pointer;font-family:inherit;
}
.action-chip:hover{border-color:var(--gold)}
.detail-stats{
  font-size:9px;color:#8aaac8;display:flex;flex-direction:column;gap:4px;
  padding:8px;background:rgba(0,0,0,.3);border:1px solid var(--navy2);
}
.detail-stats b{color:var(--gold-light)}
.detail-empty{color:#4a6a8a;font-size:10px;text-align:center;padding-top:40px}
/* 底部栏 */
.bottom-bar{
  grid-column:1/-1;grid-row:3;
  display:flex;align-items:center;justify-content:center;
  gap:20px;font-size:9px;color:#6a8aaa;
}
.bottom-bar kbd{
  background:var(--navy2);border:1px solid #3a5a7a;
  padding:2px 7px;color:var(--gold-light);font-size:8px;border-radius:2px;
}
.bottom-bar button{
  background:linear-gradient(180deg,#214d83,#0c274d);
  color:#fff;border:3px solid #06142a;
  box-shadow:3px 3px 0 #000;
  font-family:inherit;font-size:10px;font-weight:bold;
  padding:6px 14px;cursor:pointer;
}
.bottom-bar button:hover{filter:brightness(1.15);transform:translateY(-1px)}
/* Tooltip */
.map-tooltip{
  position:absolute;pointer-events:none;
  background:var(--navy);border:2px solid var(--gold);
  padding:4px 10px;font-size:10px;color:var(--gold-light);
  z-index:20;box-shadow:3px 3px 0 #000;
  opacity:0;transition:opacity .15s;
}
.map-tooltip.visible{opacity:1}
/* POI */
.poi-group{cursor:pointer}
.poi-group:hover .poi-pin{filter:brightness(1.15)}
.poi-group.locked{opacity:.45;cursor:not-allowed}
/* 路线 */
.route-line{
  fill:none;stroke:var(--red);stroke-width:6;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:10 9;
  filter:drop-shadow(0 0 6px rgba(255,207,114,.7));
  animation:routeDash 1.2s linear infinite;
}
@keyframes routeDash{to{stroke-dashoffset:-38}}
/* 选中脉冲 */
@keyframes poiPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.poi-selected .poi-pin{animation:poiPulse .8s ease-in-out infinite}
</style>
</head>

// ═══════════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════════
function latLngToPoint(lat,lng,cfg){
  const {north,south,west,east}=cfg.bounds;
  return {
    x:((lng-west)/(east-west))*cfg.width,
    y:((north-lat)/(north-south))*cfg.height
  };
}
function poiColor(type,unlocked){
  if(!unlocked)return'#8b8b8b';
  return{
    home:'#2d6fb3',school:'#3f7f56',shop:'#c98238',
    landmark:'#d85f45',museum:'#7d5fb2',stadium:'#d85f45',
    park:'#70a95e',station:'#1e6eb8'
  }[type]||'#2d6fb3';
}
function poiEmoji(icon){
  return{
    home:'🏠',school:'🎓',bread:'🥨',museum:'🏛️',
    football:'⚽',pin:'📍',park:'🌳',train:'🚇',shop:'🛒'
  }[icon]||'📍';
}

const svg=document.getElementById('gameMap');
function $q(s){return svg.querySelector(s)}
function elNS(tag){return document.createElementNS('http://www.w3.org/2000/svg',tag)}

// ═══════════════════════════════════════════
// L2: 区域色块
// ═══════════════════════════════════════════
function renderDistricts(){
  const L=$q('#districtLayer');
  [
    ['Schwabing',    'M0,0 L400,0 L420,300 L380,400 L300,420 L0,380 Z','#fcf3e0'],
    ['Maxvorstadt',  'M400,0 L700,0 L750,280 L680,380 L420,300 Z','#fbf0da'],
    ['Altstadt',     'M380,300 L680,380 L700,550 L350,500 Z','#fdf5e6'],
    ['Haidhausen',   'M700,0 L1200,0 L1200,420 L1100,400 L750,280 Z','#faf4e4'],
    ['Au',           'M700,380 L1200,420 L1200,720 L680,700 L700,550 Z','#fcf6e8'],
    ['Sendling',     'M0,380 L380,380 L350,500 L0,500 Z','#fef8ee'],
    ['Isarvorstadt', 'M350,500 L700,550 L680,700 L0,720 L0,500 Z','#fbf2e2']
  ].forEach(([name,d,fill])=>{
    const p=elNS('path');
    p.setAttribute('d',d);p.setAttribute('fill',fill);
    p.setAttribute('stroke','#d4c4a0');p.setAttribute('stroke-width','1.5');
    p.setAttribute('stroke-dasharray','4 6');
    L.appendChild(p);

    // 区名
    const bbox=document.createElementNS('http://www.w3.org/2000/svg','text');
    const pathData=d.match(/[\d.]+/g).map(Number);
    let cx=0,cy=0;
    for(let i=0;i<pathData.length-1;i+=2){cx+=pathData[i];cy+=pathData[i+1]}
    cx/=pathData.length/2;cy/=pathData.length/2;
    bbox.setAttribute('x',cx);bbox.setAttribute('y',cy);
    bbox.setAttribute('text-anchor','middle');bbox.setAttribute('dominant-baseline','middle');
    bbox.setAttribute('font-size','8');bbox.setAttribute('fill','#b8a888');
    bbox.setAttribute('font-family','Courier New,monospace');
    bbox.setAttribute('font-style','italic');
    bbox.textContent=name.replace('(off-map)','');
    L.appendChild(bbox);
  });
}

// ═══════════════════════════════════════════
// L3: 河流
// ═══════════════════════════════════════════

  lbl.setAttribute('font-family','Courier New,monospace');

// ═══════════════════════════════════════════
// L4: 公园
// ═══════════════════════════════════════════
function renderParks(){
  const L=$q('#parkLayer');
  [
    {d:'M690,70 C830,20 1050,60 1140,130 L1130,280 C1000,230 870,280 740,220 C710,200 700,140 690,70Z',label:'Englischer Garten'},
    {d:'M510,160 C530,150 560,150 580,160 C600,175 590,195 570,200 C545,205 525,195 510,175Z',label:'Hofgarten'},
    {d:'M430,230 C460,220 490,230 500,260 C490,280 450,285 425,270Z',label:'Bot. Garten'},
    {d:'M80,520 C170,470 280,490 320,560 C250,630 120,640 60,580Z',label:'Olympiapark ↓'}
  ].forEach(p=>{
    const pa=elNS('path');
    pa.setAttribute('d',p.d);pa.setAttribute('fill','#a9c88b');
    pa.setAttribute('stroke','#6c965d');pa.setAttribute('stroke-width','3');
    L.appendChild(pa);
    const pathData=p.d.match(/[\d.]+/g).map(Number);
    let cx=0,cy=0;
    for(let i=0;i<pathData.length-1;i+=2){cx+=pathData[i];cy+=pathData[i+1]}
    cx/=pathData.length/2;cy/=pathData.length/2;
    const t=elNS('text');
    t.setAttribute('x',cx);t.setAttribute('y',cy);
    t.setAttribute('text-anchor','middle');t.setAttribute('font-size','7');
    t.setAttribute('fill','#4a6a3a');t.setAttribute('font-family','Courier New,monospace');
    t.setAttribute('font-style','italic');
    t.textContent=p.label;
    L.appendChild(t);
  });
}

// ═══════════════════════════════════════════
function renderRoads(){
  const L=$q('#roadLayer');
  [
    'M80,160 C240,140 420,150 560,200 C720,250 850,220 1120,210',

    'M520,80 C500,220 520,350 510,660',
    'M940,90 C900,250 920,400 880,670',
    'M700,250 C650,280 620,380 600,500 C580,580 610,640 620,680',
    'M180,400 C350,410 520,420 680,500'
  ].forEach(d=>{
    const base=elNS('path');
    base.setAttribute('d',d);base.setAttribute('fill','none');
    base.setAttribute('stroke','#c9b488');base.setAttribute('stroke-width','14');
    base.setAttribute('stroke-linecap','round');
    L.appendChild(base);
    const center=elNS('path');
    center.setAttribute('d',d);center.setAttribute('fill','none');
    center.setAttribute('stroke','#f6ead0');center.setAttribute('stroke-width','4');
    center.setAttribute('stroke-linecap','round');
    L.appendChild(center);
  });
}

// ═══════════════════════════════════════════
// L6: 地铁线
// ═══════════════════════════════════════════
function renderSubwayLines(){
  const L=$q('#subwayLayer');
  [
    {id:'U3',color:'#e2a43d',d:'M80,130 C260,190 430,250 580,340 C730,430 900,500 1120,560'},
    {id:'U6',color:'#1e6eb8',d:'M100,620 C260,530 420,430 560,340 C700,250 860,220 1120,180'}
  ].forEach(l=>{
    const pa=elNS('path');
    pa.setAttribute('d',l.d);pa.setAttribute('fill','none');
    pa.setAttribute('stroke',l.color);pa.setAttribute('stroke-width','8');
    pa.setAttribute('stroke-linecap','round');pa.setAttribute('opacity','.8');
    L.appendChild(pa);
    const t=elNS('text');
    t.setAttribute('x','70');t.setAttribute('y',l.id==='U3'?'125':'615');
    t.setAttribute('font-family','Courier New,monospace');
    t.setAttribute('font-size','13');t.setAttribute('font-weight','bold');
    t.setAttribute('fill',l.color);t.setAttribute('stroke','#06142a');
    t.setAttribute('stroke-width','3');t.setAttribute('paint-order','stroke');
    t.textContent=l.id;
    L.appendChild(t);
  });
}

// ═══════════════════════════════════════════
// L7+L8: POI
// ═══════════════════════════════════════════
function renderPois(){
  const L=$q('#poiLayer');L.innerHTML='';
  pois.forEach(poi=>{
    const {x,y}=latLngToPoint(poi.lat,poi.lng,mapConfig);
    const color=poiColor(poi.type,poi.unlocked);

    const g=elNS('g');
    g.classList.add('poi-group');
    if(!poi.unlocked)g.classList.add('locked');
    g.dataset.id=poi.id;
    g.setAttribute('transform',`translate(${x},${y})`);
    g.style.cursor=poi.unlocked?'pointer':'not-allowed';

    g.innerHTML=`
      <g class="poi-pin">
        <path d="M0,-34 C-18,-34 -30,-18 -30,-3 C-30,16 0,40 0,40 C0,40 30,16 30,-3 C30,-18 18,-34 0,-34Z"
          fill="#000" opacity=".25" transform="translate(2,3)"/>
        <path d="M0,-34 C-18,-34 -30,-18 -30,-3 C-30,16 0,40 0,40 C0,40 30,16 30,-3 C30,-18 18,-34 0,-34Z"
          fill="${color}" stroke="#06142a" stroke-width="4"/>
        <circle cx="0" cy="-7" r="14" fill="#f7eed9" stroke="#06142a" stroke-width="3"/>
        <text x="0" y="-1" text-anchor="middle" dominant-baseline="middle"
          font-size="15">${poiEmoji(poi.icon)}</text>
      </g>
      <rect x="-62" y="40" width="124" height="22" rx="3"
        fill="#07152b" stroke="#e8b85c" stroke-width="2"/>
      <text x="0" y="55" text-anchor="middle" font-size="12"
        font-weight="bold" fill="#fff" stroke="#06142a" stroke-width="3"
        paint-order="stroke" font-family="Courier New,monospace">${poi.name}</text>
    `;

    if(poi.unlocked){
      g.addEventListener('click',e=>{e.stopPropagation();selectPoi(poi)});
      g.addEventListener('mouseenter',e=>showTooltip(e,poi));
      g.addEventListener('mouseleave',hideTooltip);
    }
    L.appendChild(g);
  });
}

// ═══════════════════════════════════════════
// 右侧面板
// ═══════════════════════════════════════════
let selectedPoi=null;
function selectPoi(poi){
  selectedPoi=poi;
  document.querySelectorAll('.poi-group').forEach(g=>g.classList.remove('poi-selected'));
  const g=document.querySelector(`.poi-group[data-id="${poi.id}"]`);
  if(g)g.classList.add('poi-selected');

  const panel=document.getElementById('detailPanel');
  const color=poiColor(poi.type,poi.unlocked);
  const lockClass=poi.unlocked?'':'style="opacity:.5;pointer-events:none"';
  panel.innerHTML=`
    <div class="detail-header">
      <h2><span style="color:${color};font-size:20px">${poiEmoji(poi.icon)}</span> ${poi.name}</h2>
      <div class="de-name">${poi.name_de}</div>
    </div>
    <div class="detail-desc">${poi.description}</div>
    <div class="detail-actions">
      ${poi.actions.map(a=>`<button class="action-chip" ${lockClass} onclick="doAction('${poi.id}','${a}')">${a}</button>`).join('')}
    </div>
    <div class="detail-stats">
      <div>🚶 步行：<b>${poi.walk_minutes} min</b></div>
      <div>🚇 ${poi.ubahn}</div>
      <div>💰 预计花费：<b>${poi.cost}</b></div>
    </div>
    <button onclick="showRouteTo('${poi.id}')" style="margin-top:4px">↗ 显示路线</button>
  `;
}
function doAction(poiId,action){
  alert(`🎮 动作: ${action}\n📍 地点: ${poiId}\n(后续接入游戏逻辑)`);
}

// ═══════════════════════════════════════════
// 路线动画
// ═══════════════════════════════════════════
function showRouteTo(poiId){
  const L=$q('#routeLayer');L.innerHTML='';
  const home=pois.find(p=>p.id==='home');
  const target=pois.find(p=>p.id===poiId);
  if(!home||!target)return;

  const p1=latLngToPoint(home.lat,home.lng,mapConfig);
  const p2=latLngToPoint(target.lat,target.lng,mapConfig);
  const mx=(p1.x+p2.x)/2+(Math.random()-.5)*80;
  const my=(p1.y+p2.y)/2-50;

  const route=elNS('path');
  route.setAttribute('d',`M${p1.x},${p1.y} Q${mx},${my} ${p2.x},${p2.y}`);
  route.setAttribute('class','route-line');
  L.appendChild(route);

  [p1,p2].forEach((p,i)=>{
    const dot=elNS('circle');
    dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);dot.setAttribute('r','8');
    dot.setAttribute('fill',i===0?'#3f7f56':'#d85f45');
    dot.setAttribute('stroke','#06142a');dot.setAttribute('stroke-width','3');
    L.appendChild(dot);
  });
}

// ═══════════════════════════════════════════
// Tooltip
// ═══════════════════════════════════════════
function showTooltip(e,poi){
  const tt=document.getElementById('mapTooltip');
  const frame=document.getElementById('mapFrame');
  const r=frame.getBoundingClientRect();
  tt.textContent=`${poi.name} · ${poi.name_de}`;
  tt.style.left=(e.clientX-r.left+20)+'px';
  tt.style.top=(e.clientY-r.top-30)+'px';
  tt.classList.add('visible');
}
function hideTooltip(){document.getElementById('mapTooltip').classList.remove('visible')}

// ═══════════════════════════════════════════
// 缩放
// ═══════════════════════════════════════════
let zoom=1;
document.getElementById('mapFrame').addEventListener('wheel',e=>{
  e.preventDefault();
  zoom=Math.max(.6,Math.min(2.5,zoom+(e.deltaY>0?-.1:.1)));
  const w=1200/zoom,h=720/zoom;
  svg.setAttribute('viewBox',`${600-w/2} ${360-h/2} ${w} ${h}`);
});
document.getElementById('btnReset').addEventListener('click',()=>{
  zoom=1;svg.setAttribute('viewBox','0 0 1200 720');hideTooltip();
});
document.getElementById('btnClearRoute').addEventListener('click',()=>{
  $q('#routeLayer').innerHTML='';
});

// ═══════════════════════════════════════════
// 启动
// ═══════════════════════════════════════════
renderDistricts();
renderRiver();
renderParks();
renderRoads();
renderSubwayLines();
renderPois();
</script>
</body>
</html>
