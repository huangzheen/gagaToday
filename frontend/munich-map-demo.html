<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>München Pixel Map — FF6 Style Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e14;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
    }
    #game-container { position: relative; }
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #f4d35e; font-size: 18px; gap: 16px;
      background: #0a0e14; z-index: 10;
    }
    #loading .bar {
      width: 280px; height: 6px;
      background: #1a2332; border-radius: 3px; overflow: hidden;
    }
    #loading .bar-fill {
      width: 0%; height: 100%;
      background: #c9956b;
      transition: width 0.3s;
    }
    .control-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,14,20,0.92);
      border-top: 1px solid #2a3a4a;
      padding: 10px 20px;
      display: flex; align-items: center; justify-content: center;
      gap: 18px; color: #8aa0a8; font-size: 11px; z-index: 20;
    }
    .control-bar kbd {
      background: #1a2332; padding: 2px 7px; border-radius: 3px;
      border: 1px solid #2a3a4a; color: #f4d35e; font-size: 10px;
    }
    .control-bar a {
      color: #c9956b; text-decoration: none;
    }
    .control-bar a:hover { color: #f4d35e; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="loading">
    <span>🗺️ 加载慕尼黑像素地图...</span>
    <div class="bar"><div class="bar-fill" id="load-bar"></div></div>
  </div>
</div>

<div class="control-bar">
  <span><kbd>W A S D</kbd> / 方向键 移动</span>
  <span>🖱️ 拖拽 + 滚轮缩放</span>
  <span>⭐ 点击金色标记查看 POI</span>
  <a href="javascript:void(0)" onclick="resetCamera()">🎯 重置视角</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
// ===== 数据加载 =====
const base = '/public/assets/munich_map';

async function loadJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`加载失败: ${url}`);
  return res.json();
}

// ===== 场景定义 (与 MunichMapScene.js 一致) =====
class MunichMapScene extends Phaser.Scene {
  constructor() {
    super({ key: 'MunichMapScene' });
  }

  preload() {
    this.load.image('munich_tileset', base + '/tileset.png');
  }

  create() {
    const tilemapData = this.cache.json.get('tilemap');
    const { cols, rows, tileWidth, tileHeight } = tilemapData;
    const layerData = tilemapData.layers[0].data;
    const pois = this.cache.json.get('pois');

    this.tileW = tileWidth;
    this.tileH = tileHeight;
    this.mapCols = cols;
    this.mapRows = rows;

    // 列主序 → 行主序
    const rowData = [];
    for (let r = 0; r < rows; r++) {
      rowData[r] = [];
      for (let c = 0; c < cols; c++) {
        rowData[r][c] = layerData[c][r];
      }
    }

    const map = this.make.tilemap({ data: rowData, tileWidth, tileHeight });
    const tileset = map.addTilesetImage('munich_tileset', 'munich_tileset', tileWidth, tileHeight, 0, 0);
    this.layer = map.createLayer(0, tileset, 0, 0);

    this.cameras.main.setBackgroundColor('#18202a');

    const mapPixelW = cols * tileWidth;
    const mapPixelH = rows * tileHeight;
    this.cameras.main.setBounds(0, 0, mapPixelW, mapPixelH);
    this.cameras.main.setZoom(2.5);

    // 定位到 Marienplatz
    const marien = pois.find(p => p.name === 'Marienplatz');
    if (marien) {
      this.cameras.main.centerOn(
        marien.col * tileWidth + tileWidth / 2,
        marien.row * tileHeight + tileHeight / 2,
      );
    }

    // POI 标记
    pois.forEach(poi => this.createPOIMarker(poi));

    // 按键
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = {
      W: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W),
      A: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A),
      S: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S),
      D: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D),
    };

    // 拖拽
    this.input.on('pointermove', (pointer) => {
      if (pointer.isDown) {
        this.cameras.main.scrollX -= pointer.velocity.x * 0.3;
        this.cameras.main.scrollY -= pointer.velocity.y * 0.3;
      }
    });

    // 滚轮
    this.input.on('wheel', (pointer, gObj, dx, dy) => {
      const z = Phaser.Math.Clamp(this.cameras.main.zoom - dy * 0.002, 1, 4);
      this.cameras.main.setZoom(z);
    });

    // 标题 + 提示
    const hLabel = this.add.text(mapPixelW / 2, 8,
      'MÜNCHEN — Altstadt  |  ' + pois.length + ' Sehenswürdigkeiten', {
        fontFamily: 'monospace', fontSize: '10px', color: '#f4d35e',
      }).setOrigin(0.5).setScrollFactor(0).setDepth(100);

    // POI 计数
    this.add.text(mapPixelW - 10, mapPixelH - 10,
      'Daten: © OpenStreetMap | 16px Tile', {
        fontFamily: 'monospace', fontSize: '7px', color: '#4a5a6a',
      }).setOrigin(1, 1).setScrollFactor(0).setDepth(100);
  }

  createPOIMarker(poi) {
    const cx = poi.col * this.tileW + this.tileW / 2;
    const cy = poi.row * this.tileH + this.tileH / 2;

    // 金色菱形
    const marker = this.add.polygon(cx, cy - 8,
      [0, -7, 6, 0, 0, 7, -6, 0], 0xf4d35e, 1);
    marker.setStrokeStyle(1, 0xd4a020, 1);
    this.tweens.add({
      targets: marker, y: cy - 13,
      scale: { from: 1, to: 0.85 },
      duration: 1200, yoyo: true, repeat: -1, ease: 'Sine.easeInOut',
    });

    // 光晕
    const glow = this.add.circle(cx, cy - 8, 10, 0xf4d35e, 0.12);
    this.tweens.add({
      targets: glow, alpha: { from: 0.12, to: 0.04 },
      scale: { from: 1, to: 1.6 },
      duration: 1600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut',
    });

    // 标签
    const label = this.add.text(cx, cy - 18, poi.name, {
      fontFamily: 'monospace', fontSize: '7px', color: '#fff3cf',
      backgroundColor: 'rgba(0,0,0,0.55)',
      padding: { x: 3, y: 1 },
    }).setOrigin(0.5, 1);

    // 点击
    const hit = this.add.rectangle(cx, cy, 32, 32, 0x000000, 0);
    hit.setInteractive({ useHandCursor: true });
    hit.on('pointerover', () => {
      label.setColor('#f4d35e');
      label.setBackgroundColor('rgba(20,30,50,0.85)');
    });
    hit.on('pointerout', () => {
      label.setColor('#fff3cf');
      label.setBackgroundColor('rgba(0,0,0,0.55)');
    });
    hit.on('pointerdown', () => this.showPOIInfo(poi));

    this.poiGroup = this.poiGroup || this.add.group();
    this.poiGroup.addMultiple([marker, glow, label, hit]);
  }

  showPOIInfo(poi) {
    if (this.infoBox) { this.infoBox.destroy(); }
    const cx = poi.col * this.tileW + this.tileW / 2;
    const cy = poi.row * this.tileH + this.tileH / 2;

    this.infoBox = this.add.container(cx, cy - 42);
    const bg = this.add.rectangle(0, 0, 170, 38, 0x0a0e1a, 0.92);
    bg.setStrokeStyle(1, 0xc9956b, 0.9);
    this.infoBox.add(bg);

    const t = this.add.text(0, -8, poi.name, {
      fontFamily: 'monospace', fontSize: '9px', color: '#f4d35e',
    }).setOrigin(0.5);
    this.infoBox.add(t);

    const d = this.add.text(0, 8, poi.desc, {
      fontFamily: 'monospace', fontSize: '7px', color: '#aab8bf',
    }).setOrigin(0.5);
    this.infoBox.add(d);

    this.time.delayedCall(4000, () => {
      if (this.infoBox) { this.infoBox.destroy(); this.infoBox = null; }
    });
  }

  update() {
    const speed = 4;
    let dx = 0, dy = 0;
    if (this.cursors.left.isDown || this.wasd.A.isDown) dx -= speed;
    if (this.cursors.right.isDown || this.wasd.D.isDown) dx += speed;
    if (this.cursors.up.isDown || this.wasd.W.isDown) dy -= speed;
    if (this.cursors.down.isDown || this.wasd.S.isDown) dy += speed;
    if (dx || dy) {
      this.cameras.main.scrollX += dx;
      this.cameras.main.scrollY += dy;
    }
  }

  resetToMarienplatz() {
    const pois = this.cache.json.get('pois');
    const m = pois.find(p => p.name === 'Marienplatz');
    if (m) {
      this.cameras.main.setZoom(2.5);
      this.cameras.main.centerOn(
        m.col * this.tileW + this.tileW / 2,
        m.row * this.tileH + this.tileH / 2,
      );
    }
  }
}

// ===== 启动 =====
let game;

async function init() {
  const barFill = document.getElementById('load-bar');

  // 先加载数据
  barFill.style.width = '10%';
  const tilemap = await loadJSON(base + '/tilemap.json');
  barFill.style.width = '50%';
  const pois = await loadJSON(base + '/pois.json');
  barFill.style.width = '80%';

  // 创建 Phaser Game
  game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 1024,
    height: 640,
    backgroundColor: '#18202a',
    pixelArt: true,
    roundPixels: true,
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH,
    },
    scene: [MunichMapScene],
    callbacks: {
      postBoot: (game) => {
        // 注入 tilemap + pois 到 cache
        game.cache.json.add('tilemap', tilemap);
        game.cache.json.add('pois', pois);
      },
    },
  });

  barFill.style.width = '100%';
  setTimeout(() => {
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
    }, 400);
  }, 500);
}

// 全局重置函数
function resetCamera() {
  if (game) {
    const scene = game.scene.getScene('MunichMapScene');
    if (scene && scene.resetToMarienplatz) {
      scene.resetToMarienplatz();
    }
  }
}

init();
</script>
</body>
</html>
