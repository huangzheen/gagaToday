<style>
/* ═══════════════════════════════════════════
   16-BIT RPG UI — 深蓝金 + 羊皮纸底
   ═══════════════════════════════════════════ */
:root{--navy:#07152b;--navy2:#0d2344;--navy3:#14305c;--gold:#e8b85c;--gold2:#ffcf72;--paper:#f1dfbd}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 50% 10%,#17345c,#050b16);font-family:'Courier New',monospace;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
.game-shell{width:1280px;height:800px;display:grid;grid-template-columns:200px 1fr 280px;grid-template-rows:56px 1fr 48px;gap:8px;padding:8px}
/* 面板 */
.px-panel{background:linear-gradient(180deg,var(--navy3),var(--navy));border:3px solid var(--gold);box-shadow:5px 5px 0 rgba(0,0,0,.7);position:relative}
.px-panel::after{content:'';position:absolute;inset:1px;border:1px solid rgba(232,184,92,.18);pointer-events:none}
/* 顶栏 */
.top-bar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.top-title{font-size:16px;font-weight:bold;color:var(--gold2);letter-spacing:3px;text-shadow:2px 2px 0 #000}
.top-sub{font-size:9px;color:#6a8aaa;letter-spacing:2px}
.top-stats{display:flex;gap:16px;font-size:10px}
.top-stats s{color:#8aaac8;font-size:9px}
.top-stats b{color:var(--gold2)}
/* 左面板 */
.left-panel{grid-column:1;grid-row:2;padding:10px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sec h3{font-size:9px;color:var(--gold);letter-spacing:2px;margin-bottom:6px;padding-bottom:3px;border-bottom:2px solid var(--navy2)}
.sec p,.sec li{font-size:8px;color:#8aaac8;line-height:1.5}
.qlist{list-style:none}.qlist li{padding:3px 0;display:flex;align-items:center;gap:5px}
.qlist li::before{content:'⬡';color:var(--gold);font-size:9px}
.qlist li.done{color:#5a7a5a}.qlist li.done::before{content:'✦';color:#5a9a5a}
/* 地图 */
.map-frame{grid-column:2;grid-row:2;position:relative;background:var(--paper);border:4px solid #c38a4f;box-shadow:9px 9px 0 rgba(0,0,0,.7);overflow:hidden}
.map-frame canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
.map-svg{position:absolute;inset:0;pointer-events:none;z-index:2}
.poi-hit{position:absolute;cursor:pointer;pointer-events:auto}
/* 右面板 */
.right-panel{grid-column:3;grid-row:2;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.detail-empty{color:#4a6a8a;font-size:9px;text-align:center;padding-top:30px}
.detail-h h2{font-size:14px;color:var(--gold2);margin-bottom:1px}
.detail-h .de{font-size:9px;color:#6a8aaa;font-style:italic}
.detail-desc{font-size:9px;color:#aab8bf;line-height:1.5}
.detail-acts{display:flex;flex-wrap:wrap;gap:4px}
.act{background:var(--navy2);border:2px solid #3a5a7a;color:var(--gold2);font-size:8px;padding:3px 8px;cursor:pointer;font-family:inherit}
.act:hover{border-color:var(--gold)}
.detail-meta{font-size:8px;color:#8aaac8;display:flex;flex-direction:column;gap:3px;padding:6px;background:rgba(0,0,0,.3);border:1px solid var(--navy2)}
.detail-meta b{color:var(--gold2)}
.poi-btn{flex:1;background:linear-gradient(180deg,#214d83,#0c274d);color:#fff;border:3px solid #06142a;box-shadow:3px 3px 0 #000;font-family:inherit;font-size:9px;font-weight:bold;padding:5px 10px;cursor:pointer;margin-top:4px}
.poi-btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
/* 底栏 */
.bottom-bar{grid-column:1/-1;grid-row:3;display:flex;align-items:center;justify-content:center;gap:16px;font-size:9px;color:#6a8aaa}
.bottom-bar kbd{background:var(--navy2);border:1px solid #3a5a7a;padding:2px 6px;color:var(--gold2);font-size:7px;border-radius:2px}
.bottom-bar button{background:linear-gradient(180deg,#214d83,#0c274d);color:#fff;border:3px solid #06142a;box-shadow:3px 3px 0 #000;font-family:inherit;font-size:9px;font-weight:bold;padding:4px 10px;cursor:pointer}
.bottom-bar button:hover{filter:brightness(1.15);transform:translateY(-1px)}
/* Tooltip */
.ttip{position:absolute;pointer-events:none;background:var(--navy);border:2px solid var(--gold);padding:3px 8px;font-size:9px;color:var(--gold2);z-index:30;box-shadow:3px 3px 0 #000;opacity:0;transition:opacity .12s;white-space:nowrap}
.ttip.on{opacity:1}
/* Route SVG */
.route-line{fill:none;stroke:#d85f45;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 9;filter:drop-shadow(0 0 5px rgba(255,207,114,.7));animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-38}}
</style>
</head>

// ─────────────────────────────────────────────
// 3. Web Mercator 投影
// ─────────────────────────────────────────────
function lngLatToWorld(lng, lat, zoom) {
  const scale = 256 * Math.pow(2, zoom);
  const x = (lng + 180) / 360 * scale;
  const sinLat = Math.sin(lat * Math.PI / 180);
  const y = (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * scale;
  return { x, y };
}

const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const frame = document.getElementById('mapFrame');
  const w = frame.clientWidth;
  const h = frame.clientHeight;
  const dpr = 1; // pixel art: no DPR scaling
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  return { w, h };
}

let { w: cw, h: ch } = resizeCanvas();

const viewport = {
  centerLat: 48.145,
  centerLng: 11.575,
  zoom: 14,
  worldX: 0,
  worldY: 0,
};

let centerWorld = lngLatToWorld(viewport.centerLng, viewport.centerLat, viewport.zoom);

function lngLatToScreen(lng, lat) {
  const pt = lngLatToWorld(lng, lat, viewport.zoom);
  return {
    x: (pt.x - centerWorld.x + viewport.worldX) + cw / 2,
    y: (pt.y - centerWorld.y + viewport.worldY) + ch / 2
  };
}

function pixelSnap(v) { return Math.round(v); }

function updateCenterWorld() {
  centerWorld = lngLatToWorld(viewport.centerLng, viewport.centerLat, viewport.zoom);
}

// ─────────────────────────────────────────────
// 5. Zoom 分级过滤
// ─────────────────────────────────────────────
function shouldRender(feature, zoom) {
  const p = feature.properties;
  if (p.highway) {
    const h = p.highway;
    if (h === 'motorway' || h === 'primary')   return zoom >= 10;
    if (h === 'secondary' || h === 'trunk')     return zoom >= 12;
    if (h === 'tertiary')                       return zoom >= 13;
    if (h === 'residential')                    return zoom >= 15;
    if (h === 'footway' || h === 'cycleway')    return zoom >= 16;
    return zoom >= 14;
  }
  if (p.building)      return zoom >= 15;
  if (p.waterway || p.natural === 'water') return true;
  if (p.leisure === 'park' || p.landuse === 'grass' || p.landuse === 'forest' || p.natural === 'wood') return true;
  if (p.railway === 'subway' || p.railway === 'rail') return zoom >= 11;
  if (p.railway === 'station') return zoom >= 13;
  if (p.amenity || p.tourism || p.shop) return zoom >= 15;
  return true;
}

// ─────────────────────────────────────────────
// 6. 道路样式
// ─────────────────────────────────────────────
const roadStyles = {
  motorway:    { w:8,  c:'#d98b35', o:'#6b3d1f', minZ:10 },
  primary:     { w:7,  c:'#e7b25d', o:'#7b5728', minZ:10 },
  secondary:   { w:5,  c:'#efd28a', o:'#9b8654', minZ:12 },
  tertiary:    { w:4,  c:'#f2dfad', o:'#b4a279', minZ:13 },
  residential: { w:3,  c:'#f7ecd2', o:'#c7b791', minZ:15 },
  footway:     { w:2,  c:'#eadfc5', o:'#c7b791', minZ:16, dash:true },
  cycleway:    { w:2,  c:'#c8e0c0', o:'#8aaa7a', minZ:16, dash:true },
};

const buildingColors = ['#c99568','#b97555','#d6b07a','#a96b4a','#cc9f72','#bf8058','#d4a878','#b87050','#ce9868'];

function drawRoad(ctx, feat, zoom) {
  if (!feat.geometry || feat.geometry.type !== 'LineString') return;
  const hw = feat.properties.highway;
  const style = roadStyles[hw] || roadStyles['residential'];
  if (zoom < style.minZ) return;

  const coords = feat.geometry.coordinates;
  if (coords.length < 2) return;

  ctx.beginPath();
  const p0 = lngLatToScreen(coords[0][0], coords[0][1]);
  ctx.moveTo(pixelSnap(p0.x), pixelSnap(p0.y));
  for (let i = 1; i < coords.length; i++) {
    const p = lngLatToScreen(coords[i][0], coords[i][1]);
    ctx.lineTo(pixelSnap(p.x), pixelSnap(p.y));
  }

  // outline
  ctx.strokeStyle = style.o;
  ctx.lineWidth = style.w + 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (style.dash) ctx.setLineDash([4, 3]);
  ctx.stroke();

  // center
  ctx.strokeStyle = style.c;
  ctx.lineWidth = style.w;
  ctx.setLineDash([]);
  ctx.stroke();
}

// ─────────────────────────────────────────────
// 7. 绘制函数
// ─────────────────────────────────────────────
function drawBackground(ctx) {
  ctx.fillStyle = '#f1dfbd';
  ctx.fillRect(0, 0, cw, ch);
  // 轻微纹理
  ctx.fillStyle = 'rgba(245,232,202,0.4)';
  ctx.fillRect(0, 0, cw, ch);
}

function drawPolygon(ctx, coords, fill, stroke, lw) {
  if (!coords || !coords[0] || coords[0].length < 3) return;
  const ring = coords[0];
  ctx.beginPath();
  const p0 = lngLatToScreen(ring[0][0], ring[0][1]);
  ctx.moveTo(pixelSnap(p0.x), pixelSnap(p0.y));
  for (let i = 1; i < ring.length; i++) {
    const p = lngLatToScreen(ring[i][0], ring[i][1]);
    ctx.lineTo(pixelSnap(p.x), pixelSnap(p.y));
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function drawWater(ctx, geojson, zoom) {
  const waterFeats = geojson.features.filter(f =>
    f.properties.waterway === 'river' || f.properties.natural === 'water'
  );
  for (const feat of waterFeats) {
    if (feat.geometry.type === 'Polygon' || feat.geometry.type === 'MultiPolygon') {
      drawPolygon(ctx, feat.geometry.coordinates, '#78b6d8', '#3f7ea3', 2.5);
    }
  }
}

function drawParks(ctx, geojson, zoom) {
  const parks = geojson.features.filter(f => {
    const p = f.properties;
    return p.leisure === 'park' || p.landuse === 'grass' || p.landuse === 'forest' || p.natural === 'wood';
  });
  for (const feat of parks) {
    if (feat.geometry.type === 'Polygon') {
      drawPolygon(ctx, feat.geometry.coordinates, '#a9c88b', '#6c965d', 2);
    }
  }
}

function drawRailways(ctx, geojson, zoom) {
  const subways = geojson.features.filter(f => f.properties.railway === 'subway' || f.properties.railway === 'rail');
  for (const feat of subways) {
    if (!shouldRender(feat, zoom)) continue;
    if (feat.geometry.type === 'LineString') {
      const coords = feat.geometry.coordinates;
      ctx.beginPath();
      const p0 = lngLatToScreen(coords[0][0], coords[0][1]);
      ctx.moveTo(pixelSnap(p0.x), pixelSnap(p0.y));
      for (let i = 1; i < coords.length; i++) {
        const p = lngLatToScreen(coords[i][0], coords[i][1]);
        ctx.lineTo(pixelSnap(p.x), pixelSnap(p.y));
      }
      const color = feat.properties.name === 'U3' ? '#e2a43d' : '#1e6eb8';
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  // 车站
  if (zoom >= 13) {
    const stations = geojson.features.filter(f => f.properties.railway === 'station');
    for (const feat of stations) {
      const s = lngLatToScreen(feat.geometry.coordinates[0], feat.geometry.coordinates[1]);
      ctx.fillStyle = '#07152b';
      ctx.fillRect(pixelSnap(s.x) - 5, pixelSnap(s.y) - 5, 10, 10);
      ctx.fillStyle = '#e8b85c';
      ctx.fillRect(pixelSnap(s.x) - 3, pixelSnap(s.y) - 3, 6, 6);
    }
  }
}

function drawRoads(ctx, geojson, zoom) {
  const roadFeats = geojson.features.filter(f => f.properties.highway);
  // 按宽度排序：粗路先画
  const ordered = [...roadFeats].sort((a, b) => {
    const sa = roadStyles[a.properties.highway] || { w: 2 };
    const sb = roadStyles[b.properties.highway] || { w: 2 };
    return sb.w - sa.w;
  });
  for (const feat of ordered) {
    if (!shouldRender(feat, zoom)) continue;
    drawRoad(ctx, feat, zoom);
  }
}

function getBuildingColor(feat, idx) {
  // 根据位置 hash 选色
  const c = feat.geometry.coordinates[0][0];
  const h = (c[0] * 1000 + c[1] * 1000) % buildingColors.length;
  return buildingColors[Math.abs(Math.floor(h))];
}

function drawBuildings(ctx, geojson, zoom) {
  if (zoom < 15) return;
  const blds = geojson.features.filter(f => f.properties.building);
  let i = 0;
  for (const feat of blds) {
    if (!shouldRender(feat, zoom)) continue;
    if (feat.geometry.type === 'Polygon') {
      drawPolygon(ctx, feat.geometry.coordinates, getBuildingColor(feat, i), '#6e4632', 1.5);
      i++;
    }
  }
}

function drawRealPois(ctx, geojson, zoom) {
  if (zoom < 15) return;
  const rpois = geojson.features.filter(f =>
    f.properties.amenity || f.properties.tourism || f.properties.shop
  );
  for (const feat of rpois) {
    if (feat.geometry.type !== 'Point') continue;
    const s = lngLatToScreen(feat.geometry.coordinates[0], feat.geometry.coordinates[1]);
    const x = pixelSnap(s.x), y = pixelSnap(s.y);
    // 小圆点
    ctx.fillStyle = '#d85f45';
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8b3020';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 小标签
    const name = feat.properties.name;
    if (name) {
      ctx.font = '8px "Courier New", monospace';
      ctx.fillStyle = '#07152b';
      ctx.fillText(name, x + 6, y + 3);
    }
  }
}

function drawMapLayers() {
  ctx.clearRect(0, 0, cw, ch);
  ctx.imageSmoothingEnabled = false;

  const z = viewport.zoom;
  drawBackground(ctx);
  drawWater(ctx, sampleGeoJSON, z);
  drawParks(ctx, sampleGeoJSON, z);
  drawRailways(ctx, sampleGeoJSON, z);
  drawRoads(ctx, sampleGeoJSON, z);
  drawRealPois(ctx, sampleGeoJSON, z);
  drawBuildings(ctx, sampleGeoJSON, z);

  // 像素网格 overlay (subtle)
  if (z >= 14) {
    ctx.fillStyle = 'rgba(0,0,0,0.03)';
    for (let x = 0; x < cw; x += 2) {
      ctx.fillRect(x, 0, 1, ch);
    }
    for (let y = 0; y < ch; y += 2) {
      ctx.fillRect(0, y, cw, 1);
    }
  }
}

function drawRouteOverlay(fromPoiId, toPoiId) {
  routeGroup.innerHTML = '';
  const from = gamePois.find(p => p.id === fromPoiId);
  const to = gamePois.find(p => p.id === toPoiId);
  if (!from || !to) return;

  const p1 = lngLatToScreen(from.lat, from.lng);
  const p2 = lngLatToScreen(to.lat, to.lng);
  const mx = (p1.x + p2.x) / 2 + 30;
  const my = (p1.y + p2.y) / 2 - 40;

  const route = document.createElementNS('http://www.w3.org/2000/svg','path');
  route.setAttribute('d', `M${p1.x},${p1.y} Q${mx},${my} ${p2.x},${p2.y}`);
  route.classList.add('route-line');
  routeGroup.appendChild(route);

  // 端点
  [p1, p2].forEach((p, i) => {
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y);
    dot.setAttribute('r', '7'); dot.setAttribute('fill', i === 0 ? '#3f7f56' : '#d85f45');
    dot.setAttribute('stroke', '#06142a'); dot.setAttribute('stroke-width', '2');
    routeGroup.appendChild(dot);
  });
}

  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  dragStartWorld = { x: viewport.worldX, y: viewport.worldY };
});
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  viewport.worldX = dragStartWorld.x + dx;
  viewport.worldY = dragStartWorld.y + dy;
  fullRedraw();
});

// Zoom
mapFrame.addEventListener('wheel', (e) => {
  e.preventDefault();
  const oldZoom = viewport.zoom;
  const delta = e.deltaY > 0 ? -1 : 1;
  viewport.zoom = Math.max(11, Math.min(17, viewport.zoom + delta));
  if (viewport.zoom !== oldZoom) {
    updateCenterWorld();
    viewport.worldX = 0;
    viewport.worldY = 0;
    fullRedraw();
  }
});

function fullRedraw() {
  updateSvgSize();
  updateCenterWorld();
  drawMapLayers();
  renderGamePois();
  if (selectedPoi) drawRouteOverlay('home', selectedPoi.id);
  // 更新 UI
  document.getElementById('zoomVal').textContent = viewport.zoom;
  document.getElementById('zoomLabel').textContent = viewport.zoom;
  const descs = {11:'主路+公园+河流',12:'次级道路',13:'三级道路+地铁站',14:'详细道路+POI',15:'建筑轮廓+住宅路',16:'步行道+真实POI',17:'最高细节'};
  document.getElementById('zoomDesc').textContent = viewport.zoom + ' — ' + (descs[viewport.zoom]||'');
}

// 按钮
document.getElementById('btnReset').addEventListener('click', () => {
  viewport.centerLat = 48.145; viewport.centerLng = 11.575;
  viewport.zoom = 14; viewport.worldX = 0; viewport.worldY = 0;
  selectedPoi = null;
  document.getElementById('detailPanel').innerHTML = '<div class="detail-empty"><p style="font-size:24px;margin-bottom:8px">⭐</p><p>点击 POI 查看详情</p></div>';
  updateCenterWorld();
  fullRedraw();
});
document.getElementById('btnClearRoute').addEventListener('click', () => { routeGroup.innerHTML = ''; });
document.getElementById('btnZoomIn').addEventListener('click', () => {
  viewport.zoom = Math.min(17, viewport.zoom + 1);
  updateCenterWorld(); viewport.worldX = 0; viewport.worldY = 0;
  fullRedraw();
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  viewport.zoom = Math.max(11, viewport.zoom - 1);
  updateCenterWorld(); viewport.worldX = 0; viewport.worldY = 0;
  fullRedraw();
});

// 窗口 resize
window.addEventListener('resize', () => {
  const s = resizeCanvas();
  cw = s.w; ch = s.h;
  updateCenterWorld();
  fullRedraw();
});

// ─────────────────────────────────────────────
// 10. 启动
// ─────────────────────────────────────────────
updateCenterWorld();
updateSvgSize();
drawMapLayers();
renderGamePois();
document.getElementById('zoomVal').textContent = viewport.zoom;
</script>
</body>
</html>
