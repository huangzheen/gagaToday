<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>München 16-bit Pixel Map Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1428;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
    }
    #game-container {
      position: relative;
      border: 2px solid #c9956b;
      border-radius: 2px;
      box-shadow: 0 0 40px rgba(201, 149, 107, 0.15);
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #f4d35e; font-size: 18px; gap: 16px;
      background: #0a1428; z-index: 10;
      transition: opacity 0.4s ease;
    }
    #loading .bar {
      width: 280px; height: 4px;
      background: #1a2a4a; border-radius: 2px; overflow: hidden;
    }
    #loading .bar-fill {
      width: 0%; height: 100%;
      background: #c9956b;
      transition: width 0.3s;
    }
    .page-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .map-header {
      color: #f4d35e; font-size: 13px;
      text-align: center; letter-spacing: 3px;
    }
    .map-header span {
      color: #6a8aaa; font-size: 10px; letter-spacing: 1px;
    }
    .controls {
      display: flex; align-items: center; gap: 16px;
      padding: 8px 20px;
      background: rgba(10, 20, 40, 0.9);
      border: 1px solid #2a4a6a;
      border-radius: 2px;
    }
    .controls kbd {
      background: #1a2a4a; padding: 2px 7px; border-radius: 2px;
      border: 1px solid #3a5a7a; color: #f4d35e; font-size: 10px;
    }
    .controls span {
      color: #6a8aaa; font-size: 10px;
    }
    .controls a {
      color: #c9956b; text-decoration: none; font-size: 10px;
      padding: 4px 10px; border: 1px solid #3a5a7a;
      border-radius: 2px; cursor: pointer;
    }
    .controls a:hover {
      background: #1a2a4a; color: #f4d35e;
    }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="map-header">
    MÜNCHEN · ALTSTADT<br>
    <span>10 Sehenswürdigkeiten · 16-bit Pixel Map</span>
  </div>

  <div id="game-container">
    <div id="loading">
      <span>🗺️ 加载 Altstadt 像素地图…</span>
      <div class="bar"><div class="bar-fill" id="load-bar"></div></div>
    </div>
  </div>

  <div class="controls">
    <span><kbd>W A S D</kbd> / 方向键</span>
    <span>🖱️ 拖拽 · 滚轮缩放</span>
    <span>⭐ 点击标记查看详情</span>
    <a id="btn-reset">🎯 Marienplatz</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
const base = '/public/assets/munich_map';

async function loadJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('Failed: ' + url);
  return res.json();
}

// ── Phaser Scene ──
class MunichMapScene extends Phaser.Scene {
  constructor() {
    super({ key: 'MunichMapScene' });
  }

  preload() {
    this.load.image('munich_tileset', base + '/tileset.png');
  }

  create() {
    const tm = this.cache.json.get('tilemap');
    const { cols, rows, tileWidth, tileHeight } = tm;
    const layerData = tm.layers[0].data;
    const pois = this.cache.json.get('pois');

    this.tileW = tileWidth;
    this.tileH = tileHeight;

    const mapW = cols * tileWidth;
    const mapH = rows * tileHeight;

    // 列主序 → 行主序
    const rowData = [];
    for (let r = 0; r < rows; r++) {
      rowData[r] = [];
      for (let c = 0; c < cols; c++) {
        rowData[r][c] = layerData[c][r];
      }
    }

    const map = this.make.tilemap({ data: rowData, tileWidth, tileHeight });
    const ts = map.addTilesetImage('munich_tileset', 'munich_tileset', tileWidth, tileHeight, 0, 0);
    this.layer = map.createLayer(0, ts, 0, 0);

    // 羊皮纸底色
    this.cameras.main.setBackgroundColor('#f0deb8');

    // 相机
    this.cameras.main.setBounds(0, 0, mapW, mapH);
    this.cameras.main.setZoom(2);

    const marien = pois.find(p => p.name === 'Marienplatz');
    if (marien) {
      this.cameras.main.centerOn(
        marien.col * tileWidth + tileWidth / 2,
        marien.row * tileHeight + tileHeight / 2,
      );
    }

    // POI 标记
    pois.forEach(poi => this.createQuestMarker(poi));

    // 按键
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = {
      W: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W),
      A: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A),
      S: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S),
      D: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D),
    };

    // 拖拽
    this.input.on('pointermove', (p) => {
      if (p.isDown) {
        this.cameras.main.scrollX -= p.velocity.x * 0.3;
        this.cameras.main.scrollY -= p.velocity.y * 0.3;
      }
    });

    // 滚轮
    this.input.on('wheel', (p, g, dx, dy) => {
      const z = Phaser.Math.Clamp(this.cameras.main.zoom - dy * 0.003, 1, 4);
      this.cameras.main.setZoom(z);
    });
  }

  createQuestMarker(poi) {
    const cx = poi.col * this.tileW + this.tileW / 2;
    const cy = poi.row * this.tileH + this.tileH / 2;

    // RPG 感叹号
    const ex = this.add.text(cx, cy - 14, '!', {
      fontFamily: 'Arial Black, Impact, sans-serif',
      fontSize: '18px', fontStyle: 'bold', color: '#f4d35e',
      stroke: '#000', strokeThickness: 3,
    }).setOrigin(0.5).setDepth(10);
    this.tweens.add({
      targets: ex, y: cy - 20,
      duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut',
    });

    // 光圈
    const ring = this.add.circle(cx, cy, 8, 0xf4d35e, 0.2).setDepth(9);
    this.tweens.add({
      targets: ring, scale: { from: 0.8, to: 1.8 },
      alpha: { from: 0.2, to: 0 },
      duration: 1500, repeat: -1, ease: 'Sine.easeInOut',
    });

    // 标签 (hover)
    const label = this.add.text(cx, cy - 24, poi.name, {
      fontFamily: '"Courier New", monospace', fontSize: '10px',
      color: '#0a1428', backgroundColor: 'rgba(244,211,94,0.75)',
      padding: { x: 5, y: 2 },
    }).setOrigin(0.5, 1).setDepth(10).setAlpha(0);

    // 菱形
    const diamond = this.add.polygon(cx, cy - 6,
      [0, -6, 6, 0, 0, 6, -6, 0], 0xc9956b, 1
    ).setDepth(9).setStrokeStyle(1, 0x8a6a3a, 1);

    // 热区
    const hit = this.add.rectangle(cx, cy, 40, 40, 0x000000, 0).setDepth(11);
    hit.setInteractive({ useHandCursor: true });
    hit.on('pointerover', () => {
      label.setAlpha(1);
      diamond.setFillStyle(0xf4d35e, 1);
      ex.setColor('#fff');
    });
    hit.on('pointerout', () => {
      label.setAlpha(0);
      diamond.setFillStyle(0xc9956b, 1);
      ex.setColor('#f4d35e');
    });
    hit.on('pointerdown', () => this.showInfo(poi));
  }

  showInfo(poi) {
    if (this.box) { this.box.destroy(); this.box = null; }
    const cam = this.cameras.main;
    const cx = poi.col * this.tileW + this.tileW / 2;
    const cy = poi.row * this.tileH + this.tileH / 2;
    const sx = cx - cam.scrollX;
    const sy = cy - cam.scrollY - 32;

    this.box = this.add.container(0, 0).setScrollFactor(0).setDepth(300);
    const bg = this.add.rectangle(0, 0, 220, 60, 0x0a1428, 0.94);
    bg.setStrokeStyle(2, 0xc9956b, 0.9);
    this.box.add(bg);

    this.box.add(this.add.text(0, -16, poi.name, {
      fontFamily: '"Courier New", monospace', fontSize: '13px',
      fontStyle: 'bold', color: '#f4d35e',
    }).setOrigin(0.5));

    this.box.add(this.add.text(0, 6, poi.desc, {
      fontFamily: '"Courier New", monospace', fontSize: '10px', color: '#aab8bf',
    }).setOrigin(0.5));

    this.box.add(this.add.text(0, 22, 'Altstadt · 慕尼黑', {
      fontFamily: '"Courier New", monospace', fontSize: '8px', color: '#4a6a8a',
    }).setOrigin(0.5));

    this.box.setPosition(sx, sy);

    this.time.delayedCall(4000, () => {
      if (this.box) {
        this.tweens.add({ targets: this.box, alpha: 0, duration: 300,
          onComplete: () => { if (this.box) { this.box.destroy(); this.box = null; } }
        });
      }
    });
  }

  update() {
    const speed = 5;
    let dx = 0, dy = 0;
    if (this.cursors.left.isDown || this.wasd.A.isDown) dx -= speed;
    if (this.cursors.right.isDown || this.wasd.D.isDown) dx += speed;
    if (this.cursors.up.isDown || this.wasd.W.isDown) dy -= speed;
    if (this.cursors.down.isDown || this.wasd.S.isDown) dy += speed;
    if (dx || dy) {
      this.cameras.main.scrollX += dx;
      this.cameras.main.scrollY += dy;
    }
  }

  resetToMarien() {
    const pois = this.cache.json.get('pois');
    const m = pois.find(p => p.name === 'Marienplatz');
    if (m) {
      this.cameras.main.setZoom(2);
      this.cameras.main.centerOn(
        m.col * this.tileW + this.tileW / 2,
        m.row * this.tileH + this.tileH / 2,
      );
    }
  }
}

// ── 启动 ──
let game;

async function init() {
  const bar = document.getElementById('load-bar');
  bar.style.width = '10%';
  const tilemap = await loadJSON(base + '/tilemap.json');
  bar.style.width = '50%';
  const pois = await loadJSON(base + '/pois.json');
  bar.style.width = '80%';

  game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 960,
    height: 640,
    backgroundColor: '#f0deb8',
    pixelArt: true,
    roundPixels: true,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [MunichMapScene],
    callbacks: {
      postBoot: (g) => {
        g.cache.json.add('tilemap', tilemap);
        g.cache.json.add('pois', pois);
      },
    },
  });

  bar.style.width = '100%';
  setTimeout(() => {
    const el = document.getElementById('loading');
    el.style.opacity = '0';
    setTimeout(() => el.style.display = 'none', 400);
  }, 300);
}

document.getElementById('btn-reset').addEventListener('click', () => {
  if (game) {
    const sc = game.scene.getScene('MunichMapScene');
    if (sc && sc.resetToMarien) sc.resetToMarien();
  }
});

init();
</script>
</body>
</html>
