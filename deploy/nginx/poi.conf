# poi-web (poi.hzone.biz) — nginx config
# 跟 gagatoday 同结构,但 upstream 名字不同(避免配置复用混淆)
# 这里就是给运营/编辑用,流量小,但保留同样配置以便复用模式

upstream poi_api {
    server gagatoday-api:8000;  # 同一个后端容器,gagatoday-api 命名跟 compose service 对齐
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://poi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /assets — 跟 gagatoday 同样的冲突解决方案
    # poi-generator 的 vite 产物在 dist/assets/ 也叫 /assets/
    # 编辑时也要看后端 POI 资源(scene 图、icon)
    # 本地优先 + 后端 fallback
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri @backend_assets;
    }

    location @backend_assets {
        proxy_pass http://poi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}