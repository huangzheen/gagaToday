# gagatoday-web (gagatoday.hzone.biz) — nginx config
# SPA fallback + /api/* 反代到 gagatoday-api 容器

# 上游负载均衡(虽然只有一个 api 实例,留扩展位)
upstream gagatoday_api {
    server gagatoday-api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # gzip — Vue dist 压缩后小很多
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 静态资源 cache(文件名带 hash,vite 默认产物)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 健康端点(给容器 HEALTHCHECK 用)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # /api/* 反代到后端容器
    # 保留原始 Host(后端可能用来看 CORS / 日志)
    location /api/ {
        proxy_pass http://gagatoday_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长轮询友好
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /assets/* — 路径冲突解决方案:
    # vite 产物(JS/CSS)在 dist/assets/ 也用 /assets/ 路径
    # 后端 PMTiles/scene/icon 在 FastAPI StaticFiles mount /assets/
    # 两个都用 /assets/ → 必须本地优先 + 后端 fallback
    #
    # 流程: nginx 先在本地 dist 找,找不到才转给后端
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri @backend_assets;
        # 找到的(JS/CSS)走下面的 regex location 加 cache 头
    }

    # 后端 fallback — PMTiles / scene / icon
    location @backend_assets {
        proxy_pass http://gagatoday_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # PMTiles 客户端会用 Range 拉字节
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
    }

    # SPA fallback — Vue Router 用 history 模式,所有未匹配的路径返回 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP 留给前端 App.vue / index.html 自己管(已经有 nonce)
}