# gagaToday — OrbStack 生产部署
#
# 架构:
#   Cloudflare Edge
#       ↓ (Zero Trust Tunnel)
#   cloudflared 容器(已有,不动)
#       ↓ OrbStack Magic DNS(无需 docker network)
#   ┌────────────────────────────────────────┐
#   │  gagatoday-web  (nginx + Vue dist)     │
#   │  poi-web        (nginx + Vue dist)     │
#   │       ↘ /api/, /assets/                │
#   │  gagatoday-api  (FastAPI)              │
#   └────────────────────────────────────────┘
#
# 启动: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 第一次启动前:
#   1. cp deploy/.env.example deploy/.env
#   2. 编辑 deploy/.env,填 secrets.env 路径
#   3. 去 Cloudflare Zero Trust dashboard 加两个 hostname(见 deploy/cloudflared/README.md)
#
# 注意: 容器名(API、web 命名)是 cloudflared ingress 路由的目标

name: gagatoday

services:
  # ──────────────────────────────────────────────────
  # 1. Backend — FastAPI
  # ──────────────────────────────────────────────────
  gagatoday-api:
    build:
      context: ..
      dockerfile: backend/poi-generator/Dockerfile
    image: gagatoday-api:latest
    container_name: gagatoday-api
    restart: unless-stopped

    # 必须 join 已有 gateway-net(cloudflared 在那里)
    # 否则 OrbStack Magic DNS 解析不到新容器,cloudflared tunnel 转不进
    networks:
      - gateway-net
      - default

    # 仅 backend 暴露 host 端口(给本地调试 / docker logs)
    # 正式访问走 cloudflared → 容器名:8000
    ports:
      - "127.0.0.1:18000:8000"

    volumes:
      # assets: 18GB PMTiles + scene + icon
      # 必须 rw,FastAPI StaticFiles 偶尔会有 304/Range 探测写入
      - /Volumes/NewDisk/GermanLearning/assets:/assets:ro

      # SQLite 持久化(SQLite + WAL 模式需要 .db/.db-shm/.db-wal 三个文件)
      # 单独挂个目录,容器内指向 /data/game_data.db
      - api-db:/data

      # Vault:加载 API key(DASHSCOPE / DEEPSEEK / BRAVE)
      - /Volumes/NewDisk/.agent-secrets/secrets.env:/secrets/secrets.env:ro

    environment:
      # 路径(env-driven,见 config.py)
      - PROJECT_ROOT=/app
      - ASSETS_ROOT=/assets
      - DB_PATH=/data/game_data.db
      - CONTENT_DRAFTS_ROOT=/app/frontend/src/content/drafts/poi_generator
      - CONTENT_MUNICH_ROOT=/app/frontend/src/content/munich
      - GENERATED_PUBLIC_DIR=/app/frontend/poi-generator/public/generated

      # ── API keys 从 secrets.env 加载(env_file 注入) ──
      # 这里只列必需的 key,实际值由 env_file 提供
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - GERMANLEARNING_DEEPSEEK_API_KEY=${GERMANLEARNING_DEEPSEEK_API_KEY}
      - BRAVE_API_KEY=${BRAVE_API_KEY}

    # OrbStack Magic DNS 不用 network,但容器仍要个默认(用 default bridge)
    # 如果其他容器需要直连 api,用容器名 gagatoday-api:8000 即可

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # 日志限额(避免 18GB asset 同步日志爆盘)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────
  # 2. Frontend — game-client (玩家主客户端)
  # ──────────────────────────────────────────────────
  gagatoday-web:
    build:
      context: ..
      dockerfile: frontend/game-client/Dockerfile
    image: gagatoday-web:latest
    container_name: gagatoday-web
    restart: unless-stopped

    depends_on:
      gagatoday-api:
        condition: service_healthy

    networks:
      - gateway-net
      - default

    # 正式访问走 cloudflared → 容器名:80
    # 本地调试用 host 端口 18080(避开 80/8080/8000 等常用端口)
    ports:
      - "127.0.0.1:18080:80"

    expose:
      - "80"

    # healthcheck 继承 Dockerfile 里的(curl + 127.0.0.1 避免 IPv6 问题)

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────────
  # 3. Frontend — poi-generator (运营/编辑工具)
  # ──────────────────────────────────────────────────
  poi-web:
    build:
      context: ..
      dockerfile: frontend/poi-generator/Dockerfile
    image: poi-web:latest
    container_name: poi-web
    restart: unless-stopped

    depends_on:
      gagatoday-api:
        condition: service_healthy

    networks:
      - gateway-net
      - default

    # 正式访问走 cloudflared → 容器名:80
    # 本地调试用 host 端口 18081
    ports:
      - "127.0.0.1:18081:80"

    expose:
      - "80"

    # healthcheck 继承 Dockerfile 里的(curl + 127.0.0.1 避免 IPv6 问题)

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: gagatoday_default
  gateway-net:
    # 复用已有的 gateway-net(cloudflared / npm / portainer / frpc-shared / openclaw 都在这)
    # 必须 join 这个网络,cloudflared 才能用容器名转发请求
    external: true

volumes:
  api-db:
    name: gagatoday-api-db
    # 默认 driver:local,数据落在 OrbStack volume 目录
    # 想直挂到 macOS 路径可以改成:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /Volumes/NewDisk/GermanLearning/.runtime/api-db
    # 但 SQLite + WAL + 容器 fs 用户映射有坑,先用 named volume