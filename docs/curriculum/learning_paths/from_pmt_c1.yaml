                  Example: Find x if 92x = 27x + 1.
                  C1 MAY 2016 SDB                                                                                    3

               Solution:   First notice that 9 = 32 and 27 = 33 and so
                           92x = 27x + 1             ⇒ (32)2x = (33)x + 1
