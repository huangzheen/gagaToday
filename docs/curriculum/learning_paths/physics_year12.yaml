  topics:
  - id: 1.3-mechanics
    name: Mechanics (1.3)
    lessons:
    - id: p1-l01-vectors
      name: Vectors and Scalars
      kp_id: kp_alevels_physics_unit1_1
      spec_ref: '1.3'
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Vectors QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Vectors MS.pdf
      learning_objectives:
      - Distinguish scalar vs vector quantities
      - Add vectors graphically and by components
      - Apply cosine rule for two non-perpendicular vectors
      suggested_papers:
      - January 2024 QP.pdf
    - id: p1-l02-kinematics
      name: Kinematics (suvat equations)
      kp_id: kp_alevels_physics_unit1_2
      spec_ref: '1.3'
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Kinematics QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Kinematics MS.pdf
      learning_objectives:
      - Apply the four suvat equations
      - Interpret s-t and v-t graphs
      - Solve 1D motion problems
      suggested_papers:
      - June 2023 QP.pdf Q1, Q2
    - id: p1-l03-projectile-motion
      name: Projectile Motion (2D under gravity)
      kp_id: kp_alevels_physics_unit1_3
      spec_ref: '1.3'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Kinematics QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Kinematics MS.pdf
      learning_objectives:
      - Split projectile motion into independent horizontal/vertical
      - Apply suvat in each direction
      - Calculate range, max height, time of flight
      suggested_papers:
      - June 2024 QP.pdf Q11 (projectile Q)
    - id: p1-l04-dynamics
      name: Dynamics (Newton's Three Laws)
      kp_id: kp_alevels_physics_unit1_4
      spec_ref: '1.3'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Forces and Moments QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Forces and Moments MS.pdf
      learning_objectives:
      - Apply F=ma (and identify W=mg)
      - Draw and use free-body diagrams
      - Solve problems on inclines, pulleys, connected bodies
      suggested_papers:
      - October 2023 QP.pdf Q13-Q15
    - id: p1-l05-moments
      name: Moments, Couples and Equilibrium
      kp_id: kp_alevels_physics_unit1_5
      spec_ref: '1.3'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Forces and Moments QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Forces and Moments MS.pdf
      learning_objectives:
      - Calculate moment M=Fd
      - Apply principle of moments for equilibrium
      - Identify a couple (two equal opposite parallel forces)
      suggested_papers:
      - June 2022 QP.pdf Q14
    - id: p1-l06-energy-power
      name: Work, Energy and Power
      kp_id: kp_alevels_physics_unit1_6
      spec_ref: '1.3'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Work, Energy and Power QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Work, Energy and Power MS.pdf
      learning_objectives:
      - Apply W=Fs cos θ
      - Use energy conservation (KE, GPE, elastic)
      - Calculate power P=W/t = Fv
      suggested_papers:
      - January 2023 QP.pdf Q11 (energy bar chart)
    - id: p1-l07-momentum-impulse
      name: Momentum and Impulse (1D)
      kp_id: kp_alevels_physics_unit1_7
      spec_ref: '1.3'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Momentum QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Momentum MS.pdf
      learning_objectives:
      - Apply p=mv and impulse FΔt=Δp
      - Solve 1D elastic and inelastic collisions
      - Solve 1D explosions
      suggested_papers:
      - June 2021 QP.pdf Q15-Q17
  - id: 1.4-materials
    name: Materials (1.4)
    lessons:
    - id: p1-l08-density-upthrust
      name: Density and Upthrust
      kp_id: kp_alevels_physics_unit1_8
      spec_ref: '1.4'
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Density and Upthrust QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Density and Upthrust MS.pdf
      learning_objectives:
      - Calculate density ρ=m/V
      - Apply Archimedes principle (upthrust = ρgV)
      - Determine floating/sinking
      suggested_papers:
      - Specimen QP.pdf Q5
    - id: p1-l09-fluid-pressure
      name: Fluid Pressure and Flow
      kp_id: kp_alevels_physics_unit1_9
      spec_ref: '1.4'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Fluids QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Fluids MS.pdf
      learning_objectives:
      - Calculate P=F/A and P=ρgh
      - Apply Pascal's principle
      - Apply continuity equation
      suggested_papers:
      - October 2022 QP.pdf Q12
    - id: p1-l10-hookes-law
      name: Hooke's Law and Elastic Deformation
      kp_id: kp_alevels_physics_unit1_10
      spec_ref: '1.4'
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Hooke's Law and Young's Modulus QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Hooke's Law and Young's Modulus MS.pdf
      learning_objectives:
      - Apply F=kx within elastic limit
      - Interpret F-x graphs (linear region = gradient k)
      - Distinguish elastic vs plastic deformation
      suggested_papers:
      - January 2022 QP.pdf Q10
    - id: p1-l11-youngs-modulus
      name: Stress, Strain and Young's Modulus
      kp_id: kp_alevels_physics_unit1_11
      spec_ref: '1.4'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Hooke's Law and Young's Modulus QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Hooke's Law and Young's Modulus MS.pdf
      learning_objectives:
      - Calculate tensile stress σ=F/A and strain ε=ΔL/L
      - Apply E=σ/ε
      - Interpret stress-strain graphs (yield, ultimate, breaking)
      suggested_papers:
      - June 2023 QP.pdf Q12
    - id: p1-l12-drag-viscosity
      name: Drag, Terminal Velocity and Stokes' Law
      kp_id: kp_alevels_physics_unit1_12
      spec_ref: '1.4'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Fluids QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-1/Fluids MS.pdf
      learning_objectives:
      - Distinguish Stokes (laminar, F∝v) and drag (turbulent, F∝v²)
      - Apply F=6πηrv
      - Identify terminal velocity condition W=F_d
      suggested_papers:
      - October 2024 QP.pdf Q14
- id: unit-2
  code: WPH12/01
  name: Waves and Electricity
  spec_sections:
  - 2.3 Waves and Particle Nature of Light
  - 2.4 Electric Circuits
  paper_structure:
    total_marks: 80
    duration_minutes: 90
    question_format:
    - 'Section A: 10 MCQ (10 marks)'
    - 'Section B: short-answer + structured (70 marks)'
  weight_to_ias: 50%
  weight_to_ial: 25%
  primary_notes_pdf: docs/curriculum/raw_pmt/Physics_Notes/Unit2_Combined_Notes.pdf
  detailed_notes:
  - docs/curriculum/raw_pmt/Physics_Notes/Unit2_Detailed_2.3_Waves_Particle.pdf
  - docs/curriculum/raw_pmt/Physics_Notes/Unit2_Detailed_2.4_Electric_Circuits.pdf
  past_papers_dir: docs/curriculum/raw_pmt/Physics_papers/Unit-2/
