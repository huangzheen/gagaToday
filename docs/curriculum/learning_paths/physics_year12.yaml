      - docs/curriculum/raw_pmt/Physics_questions/Unit-4/Capacitance QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-4/Capacitance MS.pdf
      learning_objectives:
      - Apply time constant τ=RC
      - Apply V(t)=V₀(1-e^(-t/τ)) charging
      - Apply V(t)=V₀e^(-t/τ) discharging
    - id: p4-l06-magnetic-force
      name: Magnetic Fields and Force on a Current
      kp_id: kp_alevels_physics_unit4_6
      spec_ref: '4.4'
      difficulty: 3/5
      exercises:
