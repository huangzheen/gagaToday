    - MS/Specimen MS.pdf
  topics:
  - id: 3.2-core-practicals
    name: Core Practicals (CP1-CP8)
    lessons:
    - id: p3-l01-cp1-free-fall
      name: CP1 — Acceleration of a Freely-Falling Object
      kp_id: kp_alevels_physics_unit3_1
      spec_ref: 3.2.CP1
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_Notes/Unit3_CP1_Free_Fall.pdf
      learning_objectives:
      - Use light gates / data logger for free-fall
      - Calculate g from velocity vs time or v² vs distance
      - Identify systematic (air resistance) and random errors
      suggested_papers:
      - June 2023 QP.pdf Q1 (CP1-based scenario)
    - id: p3-l02-cp2-viscosity
      name: CP2 — Viscosity of a Liquid
      kp_id: kp_alevels_physics_unit3_2
      spec_ref: 3.2.CP2
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_Notes/Unit3_CP2_Viscosity.pdf
      learning_objectives:
      - Apply Stokes' law η=2r²g(ρ_ball-ρ_liq)/(9v_terminal)
      - Verify terminal velocity reached
      - Account for container wall correction
    - id: p3-l03-cp3-youngs-modulus
      name: CP3 — Young Modulus of a Material
      kp_id: kp_alevels_physics_unit3_3
      spec_ref: 3.2.CP3
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_Notes/Unit3_CP3_Young_Modulus.pdf
      learning_objectives:
      - Use Searle's apparatus to measure extension vs load
      - Plot stress-strain or F-ΔL graph
      - Calculate E from gradient
    - id: p3-l04-cp4-speed-sound
      name: CP4 — Speed of Sound in Air
      kp_id: kp_alevels_physics_unit3_4
      spec_ref: 3.2.CP4
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_Notes/Unit3_CP4_Speed_of_Sound.pdf
      learning_objectives:
      - Use resonance tube to find λ from successive resonances
      - Calculate v=fλ
      - Identify and correct for end-correction
    - id: p3-l05-cp5-vibrating-string
      name: CP5 — Frequency of a Vibrating String
      kp_id: kp_alevels_physics_unit3_5
      spec_ref: 3.2.CP5
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_Notes/Unit3_CP5_Frequency_String.pdf
      learning_objectives:
      - Use sonometer to verify f=(1/2L)√(T/μ)
      - Plot f² vs T to confirm linear relationship
      - Calculate μ from gradient
    - id: p3-l06-cp6-diffraction-grating
      name: CP6 — Wavelength of Light Using Diffraction Grating
      kp_id: kp_alevels_physics_unit3_6
      spec_ref: 3.2.CP6
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_Notes/Unit3_CP6_Diffraction_Grating.pdf
      learning_objectives:
      - Apply d sinθ=nλ for grating
      - Measure angle for first/second order maxima
      - Average left/right to reduce alignment error
    - id: p3-l07-cp7-resistivity
      name: CP7 — Electrical Resistivity of a Material
      kp_id: kp_alevels_physics_unit3_7
      spec_ref: 3.2.CP7
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_Notes/Unit3_CP7_Resistivity.pdf
      learning_objectives:
      - Measure R of wire for different lengths
      - Apply ρ=RA/L
      - Plot R vs L to find ρ/A from gradient
    - id: p3-l08-cp8-emf-internal-r
      name: CP8 — EMF and Internal Resistance
      kp_id: kp_alevels_physics_unit3_8
      spec_ref: 3.2.CP8
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_Notes/Unit3_CP8_EMF.pdf
      learning_objectives:
      - Measure V and I for varying external R
      - Plot V vs I to find ε (intercept) and r (gradient)
      - Apply ε=I(R+r)
