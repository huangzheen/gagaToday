  code: WPH11/01
  name: Mechanics and Materials
  spec_sections:
  - 1.3 Mechanics
  - 1.4 Materials
  paper_structure:
    total_marks: 80
    duration_minutes: 90
    question_format:
    - 'Section A: 10 MCQ (10 marks)'
    - 'Section B: short-answer + structured (70 marks)'
  weight_to_ias: 50%
  weight_to_ial: 25%
  primary_notes_pdf: docs/curriculum/raw_pmt/Physics_Notes/Unit1_Combined_Notes.pdf
  past_papers_dir: docs/curriculum/raw_pmt/Physics_papers/Unit-1/
  past_paper_files:
    qp:
    - QP/January 2020 QP.pdf
