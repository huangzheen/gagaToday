      - docs/curriculum/raw_pmt/Physics_questions/Unit-4/Magnetic Fields and EM Induction MS.pdf
      learning_objectives:
      - Apply Faraday's law ε=-NdΦ/dt
      - Apply Lenz's law (induced current opposes change)
      - Apply transformer ratio V_p/V_s=N_p/N_s
    - id: p4-l08-charged-particles
      name: Charged Particles in Fields
      kp_id: kp_alevels_physics_unit4_8
      spec_ref: '4.4'
      difficulty: 3/5
      exercises:
