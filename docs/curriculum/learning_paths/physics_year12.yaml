      - docs/curriculum/raw_pmt/Physics_questions/Unit-4/Charged Particles in Fields MS.pdf
      learning_objectives:
      - Apply r=mv/(BQ) for circular motion in B
      - Apply eV=½mv² for accelerating p.d.
      - Calculate e/m from mass spectrometer
  - id: 4.5-nuclear-particle
