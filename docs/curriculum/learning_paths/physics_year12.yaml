    - MS/January 2021 MS.pdf
    - MS/January 2022 MS.pdf
    - MS/January 2023 MS.pdf
    - MS/January 2024 MS.pdf
    - MS/June 2021 MS.pdf
    - MS/June 2022 MS.pdf
    - MS/June 2023 MS.pdf
    - MS/June 2024 MS.pdf
    - MS/October 2020 MS.pdf
    - MS/October 2021 MS.pdf
    - MS/October 2022 MS.pdf
    - MS/October 2023 MS.pdf
    - MS/October 2024 MS.pdf
    - MS/Specimen MS.pdf
  topics:
  - id: 2.3-waves-particle-nature
    name: Waves and Particle Nature of Light (2.3)
    lessons:
    - id: p2-l01-progressive-waves
      name: Progressive Waves (basics)
      kp_id: kp_alevels_physics_unit2_1
      spec_ref: '2.3'
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Waves QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Waves MS.pdf
      learning_objectives:
      - Distinguish transverse vs longitudinal
      - Use v=fλ and T=1/f
      - Calculate phase difference
    - id: p2-l02-waves-strings
      name: Waves on Strings and Stationary Waves
      kp_id: kp_alevels_physics_unit2_2
      spec_ref: '2.3'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Waves on Strings QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Waves on Strings MS.pdf
      learning_objectives:
      - Apply v=√(T/μ)
      - Identify harmonics on a string (λ=2L/n)
      - Describe nodes and antinodes
    - id: p2-l03-refraction-tir
      name: Refraction, TIR and Polarisation
      kp_id: kp_alevels_physics_unit2_3
      spec_ref: '2.3'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Refraction, Reflection and Polarisation QP 1.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Refraction, Reflection and Polarisation MS.pdf
      learning_objectives:
      - Apply Snell's law n₁sinθ₁=n₂sinθ₂
      - Calculate critical angle and TIR conditions
      - Explain polarisation
    - id: p2-l04-diffraction-interference
      name: Diffraction and Interference (Young's DS)
      kp_id: kp_alevels_physics_unit2_4
      spec_ref: '2.3'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Diffraction QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Diffraction MS.pdf
      learning_objectives:
      - Apply Young's double-slit λ=ax/D
      - Identify constructive (nλ) and destructive ((n+½)λ) interference
      - Describe single-slit diffraction pattern
    - id: p2-l05-photons-photoelectric
      name: Photons and the Photoelectric Effect
      kp_id: kp_alevels_physics_unit2_8
      spec_ref: '2.3'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Photons QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Photons MS.pdf
      learning_objectives:
      - Apply photon energy E=hf
      - Apply Einstein photoelectric equation hf=φ+E_k(max)
      - Explain why threshold frequency matters
    - id: p2-l06-wave-particle-duality
      name: Wave-Particle Duality and de Broglie
      kp_id: kp_alevels_physics_unit2_9
      spec_ref: '2.3'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Photons QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Photons MS.pdf
      learning_objectives:
      - Apply de Broglie λ=h/p=h/(mv)
      - State evidence for wave-particle duality
      - Use h=6.63×10⁻³⁴ J s
    - id: p2-l07-intensity-inverse-square
      name: Intensity of Radiation (Inverse Square Law)
      kp_id: kp_alevels_physics_unit2_10
      spec_ref: '2.3'
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Intensity of Radiation QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Intensity of Radiation MS.pdf
      learning_objectives:
      - Calculate intensity I=P/A
      - Apply inverse square law I=k/r²
      - Estimate power received by a detector
  - id: 2.4-electric-circuits
    name: Electric Circuits (2.4)
    lessons:
    - id: p2-l08-charge-current-emf
      name: Charge, Current, Energy and EMF
      kp_id: kp_alevels_physics_unit2_5
      spec_ref: '2.4'
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Charge, Energy and Current QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Charge, Energy and Current MS.pdf
      learning_objectives:
      - Apply I=ΔQ/Δt
      - Describe drift velocity I=nAvq
      - Define EMF and p.d.
    - id: p2-l09-resistance-resistivity
      name: Resistance, Resistivity and Components
      kp_id: kp_alevels_physics_unit2_6
      spec_ref: '2.4'
      difficulty: 2/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Resistance, Components and Resistivity QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Resistance, Components and Resistivity MS.pdf
      learning_objectives:
      - Apply Ohm's law V=IR
      - Apply resistivity ρ=RA/L
      - Interpret I-V characteristics (ohmic, filament, diode)
    - id: p2-l10-potential-dividers-emf
      name: Potential Dividers, EMF and Internal Resistance
      kp_id: kp_alevels_physics_unit2_7
      spec_ref: '2.4'
      difficulty: 3/5
      exercises:
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Potential Dividers, EMF and Internal Resistance QP.pdf
      - docs/curriculum/raw_pmt/Physics_questions/Unit-2/Potential Dividers, EMF and Internal Resistance MS.pdf
      learning_objectives:
      - Apply V_out=V_in×R₂/(R₁+R₂)
      - Apply Kirchhoff's laws
      - Apply V=ε-Ir
- id: unit-3
  code: WPH13/01
  name: Practical Skills in Physics I
  spec_sections:
  - 3.1 Planning/implementing/evaluating experiments
  - 3.2 Core Practicals
  paper_structure:
