            content: |
              1       Algebra
              Polynomials
                  A polynomial is an expression of the form
                              anxn + an –1 xn –1 + . . . a2x2 + a1x + a0
                  where all the powers of x are positive integers or 0.
                  Addition, subtraction and multiplication of polynomials are easy, division must be done by
                  long division.

                  Factorising
                  General examples of factorising:
                              2ab + 6ac2 = 2a(b + 3c2)
                              x2 – 5x + 6 = (x – 2)(x – 3)
                              x2 – 6x = x(x – 6)
                              6x2 – 11x – 10 = (3x + 2)(2x – 5)
                               2ax – 3by – 6ay + bx = 2ax – 6ay + bx – 3by
                                     = 2a(x – 3y) + b(x – 3y)
                                     = (2a + b)(x – 3y)


                  Standard results
                     x2 – y2 = (x – y)(x + y),           difference of two squares
                              (x + y)2 = x2 + 2xy + y2,
                              (x – y)2 = x2 – 2xy + y2

                  Long division
                  Example:
                                                                  3x2 – 5x     + 9
                         2                       4          3
                      2x + 3x – 1            6x      –     x           +   x   – 3
                                                 4          3      2
                                             6x + 9x            – 3x
                                                     –10x + 3x2 +
                                                            3
                                                                           x   – 3
                                                            3      2
                                                     –10x – 15x        + 5x
                                                                   2
                                                                 18x   – 4x    – 3
                                                                   2
                                                                 18x   + 27x   – 9
                                                                       – 31x   + 6


                  ⇒ when 6x4 – x3 + x – 3 is divided by 2x2 + 3x – 1,
                      the quotient is 3x2 – 5x + 9, and the remainder is –31x + 6.


                  C2 JUNE 2016 SDB                                                                 3

              Remainder theorem

               If 627 is divided by 6 the quotient is 104 and the remainder is 3.
               This can be written as 627 = 6 × 104 + 3.
               In the same way, if a polynomial
               P(x) = a0 + a1x + a2x2 + ... anxn is divided by (cx + d) to give a quotient, Q(x) with a
               remainder r, then r will be a constant (since the divisor is of degree one) and we can write
                   P(x) = (cx + d) × Q(x) + r
                   If we now choose the value of x which makes (cx + d) = 0 ⇒ x = –d/c
                   then we have P (−d c ) = 0 × Q(x) + r

                   ⇒       P (−d c ) = r.


               Theorem: If we put x = –d/c in the polynomial we obtain r, the remainder that we would
                   have after dividing the polynomial by (cx + d).


               Example: The remainder when P(x) = 2x3 + ax2 + bx + 9 is divided by (2x – 3) is –6, and
                  when P(x) is divided by (x + 2) the remainder is 1.
                   Find the values of a and b.

               Solution:   (2x – 3) = 0 when x = 3/2,
                           ⇒        dividing P(x) by (2x – 3) gives a remainder
                           P ( 3 2 ) = 2 × ( 3 2 ) 3 + a × ( 3 2 ) 2 + b × ( 3 2 ) + 9 = –6

                           ⇒        3a + 2b = –29                       I

                   and (x + 2) = 0 when x = –2,
                           ⇒        dividing P(x) by (x + 2) gives a remainder
                           P(–2) = 2 × (–2)3 + a × (–2)2 + b × (–2) + 9 = 1
                           ⇒        4a – 2b = 8                         II


                   I + II ⇒ 7a = –21
                           ⇒        a = –3
                           using I we get b = –10




               4                                                                              C2 JUNE 2016 SDB

              Factor theorem

               Theorem: If, in the remainder theorem, r = 0 then (cx + d) is a factor of P(x)
               ⇒ P (−d c ) = 0    ⇔      (cx + d) is a factor of P(x).


               Example: A quadratic equation has solutions (roots) x = –1/2 and x = 3. Find the quadratic
                  equation in the form ax2 + bx + c = 0


               Solution: The equation has roots x = – ½ and x = 3
                   ⇒       it must have factors (2x + 1) and (x – 3)                   by the factor theorem

                   ⇒       an equation is (2x + 1)(x – 3) = 0
                   ⇒       2x2 – 5x – 3 = 0.                                           or any multiple


               Example: Show that (x – 2) is a factor of P(x) = 6x3 – 19x2 + 11x + 6 and hence factorise
                  the expression completely.


               Solution: Choose the value of x which makes          (x – 2) = 0, i.e. x = 2
                   ⇒       remainder = P(2) = 6 × 8 – 19 × 4 + 11 × 2 + 6 = 48 – 76 + 22 + 6 = 0
                   ⇒       (x – 2) is a factor by the factor theorem.
                   We have started with a cubic and so we the other factor must be a quadratic, which can
                   be found by long division or by ‘common sense’.
                   ⇒       6x3 – 19x2 + 11x + 6 = (x – 2)(6x2 – 7x – 3)
                   =       (x – 2)(2x – 3)(3x + 1)
                   which is now factorised completely.




               C2 JUNE 2016 SDB                                                                          5

              Choosing a suitable factor
              To choose a suitable factor we look at the coefficient of the highest power of x and the
              constant (the term without an x).


              Example: Factorise 2x3 + x2 – 13x + 6.


              Solution: 2 is the coefficient of x3 and 2 has factors of 2 and 1.
                  6 is the constant term and 6 has factors of 1, 2, 3 and 6
                  ⇒        the possible linear factors of 2x3 + x2 – 13x + 6 are
                           (x ± 1),      (x ± 2),      (x ± 3),       (x ± 6)
                           (2x ± 1),     (2x ± 2),     (2x ± 3),      (2x ± 6)


                  But     (2x ± 2) = 2(x ± 1)   and    (2x ± 6) = 2(x ± 3), so they are not new factors.


                  We now test the possible factors using the factor theorem until we find one that works.
                        Test   (x – 1), put x = 1     giving 2 × 13 + 12 – 13 × 1 + 6 ≠ 0
                        Test   (x + 1), put x = –1    giving 2 × (–1)3 + (–1)2 – 13 × (–1) + 6 ≠ 0
                        Test   (x – 2), put x = 2     giving 2 × 23 + 22 – 13 × 2 + 6 = 16 + 4 – 26 + 6 = 0
                        and since the result is zero (x – 2) is a factor.


                  We now divide to give
                  2x3 + x2 – 13x + 6     = (x – 2)(2x2 + 5x – 3)
                                         = (x – 2)(2x – 1)(x + 3).




              6                                                                      C2 JUNE 2016 SDB

              Cubic equations

               Factorise using the factor theorem then solve.
                   N.B. The quadratic factor might not factorise in which case you will need to use the
               formula for this part.


               Example: Solve the equation           2x3 + x2 – 3x + 1 = 0.


               Solution: Possible factors are (x ± 1) and (2x ± 1).
                   Put x = 1 we have 2 × 13 + 12 – 3×1 + 1 = 1 ≠ 0
                   ⇒ (x – 1) is not a factor
                   Put x = –1 we have 2 × (–1)3 + (–1)2 – 3×(–1) + 1 = 3 ≠ 0
                   ⇒ (x + 1) is not a factor
                                      1                  1 3    1 2      1
                   Putting x = 2          we have    2 × �2� + �2� – 3× 2 + 1 = 0
                   ⇒       (2x – 1) is a factor
                   ⇒       2x3 + x2 – 3x + 1 = (2x – 1)(x2 + x – 1) = 0
                                  1
                   ⇒       x = 2 or x2 + x – 1 = 0          –   this will not factorise so we use the formula

