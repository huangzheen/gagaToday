              1       Statistical modelling

              Statistical modelling
                                                                                                          1
                  Example: When a die is rolled, we say that the probability of each number is 6 . This is a
                     statistical model, but the assumption that each face is equally likely might not be true.
                      Suppose the die is weighted to increase the chance of a six. We might then find, after
                                                                      1                                 1
                      experimenting, that the probability of a six is 4 and the probability of a one is 12, with the
                                                               1
                      probability of other faces remaining at 6 , all adding up to 1. In this case we have refined,
                      or improved, the model to give a truer picture.


                  Example: The heights of a large group of adults are measured. The mean is 172⋅3 cm and the
                     standard deviation is 12⋅4 cm.
                      It could be thought that the general shape of the histogram can be modelled by the curve
                                                                      y
                                                               0.03

                                            1 𝑥−172∙3 2
                                  1        − �          �
                      f (x) =             𝑒 2    12∙4
                                                               0.02

                                12∙4√2𝜋                        0.01

                                                                                                      x
                                                                   0
                                                                   130    150   170     190     210
                                                                                172.3




                      This might not give a true picture, in which case we would have to change the equation, or
                      refine the model.

              Definition
                  A statistical model is a simplification of a real world situation, usually describing a real world
                  situation using equations. It can be used to make predictions about a real world problem. By
                  analysing and refining the model an improved understanding may be obtained.

              Advantages
                     •   the model is quick and easy to produce
                     •   the model helps our understanding of the real world problem
                     •   the model helps us to make predictions
                     •   the model helps us to control a situation – e.g. railway timetables, air traffic control etc.

              Disadvantages
                     •   the model simplifies the situation and only describes a part of the real world problem.
                     •   the model may only work in certain situations, or for a particular range of values.




